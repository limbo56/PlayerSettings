# Русский (Россия)
# Пустые кавычки отключают сообщение.
# Пример:
# - prefix: ""
# - setting-changed: ""

# Префикс, добавляемый к каждому сообщению плагина.
prefix: "&f&l(&6Настройки&f&l) &f"

settings:
  no-access: "&cУ вас нет разрешения изменять эту настройку"
  no-disable-access: "&cУ вас нет разрешения отключать эту настройку"
  # %setting% - Название настройки, которую пользователь пытался изменить
  # %max% - Максимальное значение, на которое этот пользователь может изменить уровень этой настройки
  low-access-level: "&cДоступ запрещен. Вы ограничены установкой '%setting%&c' до максимума &e%max%&c."
  no-settings-data: "&cДанные настроек для вашей учетной записи не найдены"
  wait-loading: "&cПожалуйста, подождите, пока загрузятся ваши настройки, прежде чем вносить изменения"
  # ПРИМЕЧАНИЕ: Это сообщение требует включения команды '/settings set'
  # %setting% - Название настройки, которая отключена
  # %enableAction% - Кликабельный текст для включения настройки
  self-disabled: "&cУ вас отключена настройка '%setting%&c'! %enableAction%"
  enable-action: "&e(Нажмите, чтобы включить)"
  # %setting% - Название настройки, которая отключена
  enable-action-tooltip:
    - "&6%setting%"
    - "&7Нажмите, чтобы &aвключить"

commands:
  help-header: "&e------- &6Справка по настройкам &e---------"
  help-command-format: "&f/settings %command% &8: &7%description%"
  no-access: "&cУ вас нет разрешения выполнить эту команду"
  # %setting% - Название настройки, которую пользователь пытался изменить
  setting-not-found: "&cНеизвестная настройка '&6%setting%&c'!"
  # %values% - Список допустимых значений для настройки, на которые у игрока есть разрешения
  setting-invalid-level: "&cНеверный уровень настройки! Допустимые уровни: &e%values%"
  # %setting% - Название настройки, которая была изменена
  # %value% - Значение, на которое была установлена настройка
  setting-changed: "Настройка '&6%setting%&f' установлена на &e%value%"
  setting-show: "&6%setting% &f- &e%value%"
  setting-unchanged: "&cНастройка '&6%setting%&c' уже установлена на &e%value%"

stacker:
  target-disabled: "&cУ этого игрока отключена настройка '&6Стакер&c'!"
  target-invalid-entity: "&cВы не можете сложить эту сущность!"

